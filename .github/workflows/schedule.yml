name: Travel Duration Scheduler

on:
  schedule:
    # Rush hours (06–09 and 15–19 UTC): 15 and 45 past each hour
    - cron: '15 6 * * *'
    - cron: '45 6 * * *'
    - cron: '15 7 * * *'
    - cron: '45 7 * * *'
    - cron: '15 8 * * *'
    - cron: '45 8 * * *'
    - cron: '15 9 * * *'
    - cron: '45 9 * * *'
    - cron: '15 15 * * *'
    - cron: '45 15 * * *'
    - cron: '15 16 * * *'
    - cron: '45 16 * * *'
    - cron: '15 17 * * *'
    - cron: '45 17 * * *'
    - cron: '15 18 * * *'
    - cron: '45 18 * * *'
    - cron: '15 19 * * *'
    - cron: '45 19 * * *'

    # All other hours: 30 past each hour
    - cron: '30 0 * * *'
    - cron: '30 1 * * *'
    - cron: '30 2 * * *'
    - cron: '30 3 * * *'
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
    - cron: '30 12 * * *'
    - cron: '30 13 * * *'
    - cron: '30 14 * * *'
    - cron: '30 20 * * *'
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'

  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl serpapi

      - name: Run travel duration script
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          python travel_duration_scheduler.py

      - name: Upload CSV file
        uses: actions/upload-artifact@v3.1.2
        with:
          name: travel_durations
          path: travel_durations.csv

      - name: Commit CSV file
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout ${{ github.ref }}
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add travel_durations.csv
          git commit -m 'Update travel durations [skip ci]' || echo "No changes to commit"
          git pull --rebase origin ${{ github.ref }}
          git push origin HEAD:${{ github.ref }}
